spring.application.name=tarjetas-test

# R2DBC H2 Configuration for testing
spring.r2dbc.url=r2dbc:h2:mem:///testdb;DB_CLOSE_DELAY=-1;MODE=Oracle

# Logging
logging.level.org.springframework.r2dbc=DEBUG
logging.level.com.prueba_be.tarjetas=DEBUG

# Actuator
management.endpoints.web.exposure.include=health,info

# Desactivar consola H2 en tests
h2.console.enabled=false

# Security
tarjetas.security.aes.secret=BancoSecreto1234

# CORS
tarjetas.cors.allowed-origins=http://localhost:5173,http://localhost:5174

# Negocio
tarjetas.card.validation-number-max=100
tarjetas.card.identifier-length=15
tarjetas.card.mask-prefix-length=6
tarjetas.card.mask-suffix-length=4
tarjetas.transaction.annul-time-limit-minutes=5
