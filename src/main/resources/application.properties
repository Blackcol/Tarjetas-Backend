spring.application.name=tarjetas

# R2DBC H2 Configuration
spring.r2dbc.url=r2dbc:h2:mem:///testdb;DB_CLOSE_DELAY=-1;MODE=Oracle
spring.r2dbc.username=sa
spring.r2dbc.password=

# Logging
logging.level.org.springframework.r2dbc=DEBUG
logging.level.com.prueba_be.tarjetas=TRACE
logging.level.root=INFO
logging.file.name=logs/app.log

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus,mappings,loggers
management.endpoint.health.show-details=always
management.endpoints.web.base-path=/actuator

# Seguridad - Llave AES para generación de identificadores
# En producción, inyectar mediante variable de entorno: TARJETAS_SECURITY_AES_SECRET
tarjetas.security.aes.secret=${TARJETAS_SECURITY_AES_SECRET:BancoSecreto1234}

# H2 Web Console (solo para desarrollo - WebFlux no soporta spring.h2.console.enabled)
# Activar/desactivar con variable de entorno: H2_CONSOLE_ENABLED=true
# Conectar usando jdbc:h2:mem:testdb;MODE=Oracle
h2.console.enabled=true
h2.console.port=8082

# CORS - Orígenes permitidos (separados por coma)
# En producción, inyectar mediante variable de entorno: TARJETAS_CORS_ALLOWED_ORIGINS
tarjetas.cors.allowed-origins=${TARJETAS_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}

# Negocio - Configuración de tarjetas
tarjetas.card.validation-number-max=100
tarjetas.card.identifier-length=15
tarjetas.card.mask-prefix-length=6
tarjetas.card.mask-suffix-length=4

# Negocio - Configuración de transacciones
# Tiempo máximo (en minutos) para anular una transacción después de crearla
tarjetas.transaction.annul-time-limit-minutes=5
